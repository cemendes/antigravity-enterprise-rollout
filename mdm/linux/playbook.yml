---
- name: Enforce Antigravity Version Lock on Linux Developer Endpoints
  hosts: workstations
  become: true
  tasks:
    - name: Ensure /etc/antigravity configuration directory exists
      ansible.builtin.file:
        path: /etc/antigravity
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy system-level policy configuration
      ansible.builtin.copy:
        dest: /etc/antigravity/settings.json
        owner: root
        group: root
        mode: '0644'
        content: |
          {
            "update.mode": "none",
            "extensions.autoCheckUpdates": false,
            "extensions.autoUpdate": false
          }
